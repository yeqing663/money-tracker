<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A38">
<title>八字排盘 · 结构分析</title>
<style>
  :root{--bg:#F6F3EE;--card:#fff;--ink:#2A2622;--sub:#7A7168;--line:#E7E0D6;
        --red:#A6392F;--gold:#B8860B;--navy:#1F2A38}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       font-size:15px;line-height:1.6;padding-bottom:40px}
  .hero{background:linear-gradient(150deg,#1F2A38,#3A241F);color:#F5EFE6;padding:26px 20px 22px}
  .hero h1{margin:0 0 6px;font-size:22px;letter-spacing:2px;font-weight:600}
  .hero p{margin:0;font-size:12.5px;color:#B8AB98;letter-spacing:1px}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0;
        box-shadow:0 2px 10px rgba(60,40,20,.05)}
  .card h2{font-size:14.5px;margin:0 0 12px;color:var(--navy);font-weight:600;
           display:flex;justify-content:space-between;align-items:center}
  .card h2 .tag{font-size:11px;color:var(--sub);font-weight:400}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:15px;font-family:inherit;color:var(--ink);background:#FCFAF7}
  input:focus,select:focus{outline:none;border-color:var(--red);background:#fff}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .seg{display:flex;background:#F1ECE4;border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;
    font-size:14px;font-family:inherit;color:var(--sub)}
  .seg button.on{background:#fff;color:var(--red);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;
    font-weight:600;color:#fff;background:linear-gradient(135deg,#A6392F,#7E2A22);margin-top:14px;
    letter-spacing:3px}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:500;
    font-size:14px;letter-spacing:1px;margin-top:10px}
  /* 四柱表 */
  .pan{display:grid;grid-template-columns:44px repeat(4,1fr);gap:1px;background:var(--line);
       border-radius:10px;overflow:hidden;font-size:13px;text-align:center}
  .pan>div{background:#fff;padding:8px 4px;min-height:30px;display:flex;flex-direction:column;
           align-items:center;justify-content:center}
  .pan .hd{background:#F3EEE6;font-size:11.5px;color:var(--sub);font-weight:600}
  .pan .lb{background:#FAF7F2;font-size:11px;color:var(--sub)}
  .gz{font-size:23px;font-weight:700;letter-spacing:1px;line-height:1.15}
  .gz .g{color:var(--red)}
  .gz .z{color:var(--navy)}
  .ss{font-size:11px;color:#8A7A66}
  .cg{font-size:11px;color:var(--sub);line-height:1.35}
  .ny{font-size:10.5px;color:#A39A8C}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #EEE7DC;
      font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv b{font-weight:600;color:var(--navy)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .chip{background:#F3EEE6;color:#7A5C3A;border-radius:8px;padding:4px 9px;font-size:12px}
  .chip.red{background:#FBEDEA;color:var(--red)}
  .dy{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
  .dy .it{min-width:66px;background:#FAF7F2;border:1px solid var(--line);border-radius:10px;
          padding:8px 6px;text-align:center;flex-shrink:0}
  .dy .it.cur{border-color:var(--red);background:#FBEDEA}
  .dy .it .a{font-size:11px;color:var(--sub)}
  .dy .it .b{font-size:17px;font-weight:700;color:var(--navy);margin:2px 0}
  .dy .it .c{font-size:10.5px;color:#A39A8C}
  .foot{font-size:11px;color:#A39A8C;text-align:center;margin:18px 4px;line-height:1.7}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:10px 0}
  .warn{background:#FDF6EC;border-left:3px solid var(--gold);padding:9px 12px;border-radius:8px;
        font-size:12.5px;color:#6B4A1E;margin-top:12px;line-height:1.6}
</style>
</head>
<body>

<div class="hero">
  <h1>八字排盘</h1>
  <p>输入出生信息 → 四柱 · 十神 · 大运 · 结构提示</p>
</div>

<div class="wrap">
  <div class="card">
    <h2>出生信息 <span class="tag">公历（阳历）</span></h2>
    <div class="row" style="margin-bottom:12px">
      <div><label>出生日期</label><input type="date" id="bd" value="2005-07-23"></div>
      <div><label>出生时间</label><input type="time" id="bt" value="04:00"></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <div><label>出生地经度（东经）</label><input type="number" id="lon" step="0.1" value="120.1"></div>
      <div><label>性别</label>
        <select id="sex"><option value="男">男</option><option value="女">女</option></select>
      </div>
    </div>
    <div class="seg" id="segTS">
      <button data-ts="1" class="on">真太阳时校正</button>
      <button data-ts="0">不校正</button>
    </div>
    <div class="seg" id="segDay">
      <button data-day="1" class="on">23点换日（传统）</button>
      <button data-day="0">0点换日（部分软件）</button>
    </div>
    <button class="btn" id="go">排 盘</button>
    <button class="btn ghost" id="demo">试试示例（1990-01-01 12:00）</button>
  </div>

  <div id="out"></div>

  <div class="foot">
    命理是传统符号系统，用于结构性自我认知，<br>
    不做吉凶预测，不构成医疗 / 投资 / 婚姻建议。
  </div>
</div>

// ══════════ 基础工具 ══════════
function pad2(n){ return (n<10?'0':'')+n; }
function jdn(y,m,d){
  var a = Math.floor((14-m)/12);
  var y2 = y + 4800 - a;
  var m2 = m + 12*a - 3;
  return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}
var JDN_OFFSET = 49; // 已校准：2005-07-23 → 戊申
function dayIndex(jdnVal){ return ((jdnVal + JDN_OFFSET) % 60 + 60) % 60; }
function gz(idx){ idx = ((idx%60)+60)%60; return GAN[idx%10] + ZHI[idx%12]; }
function gzIndex(g, z){ // 由干支反查六十甲子序号
  var gi = GAN.indexOf(g), zi = ZHI.indexOf(z);
  for (var i=0;i<60;i++){ if (i%10===gi && i%12===zi) return i; }
  return -1;
}
function shishen(dayGan, other){
  if (!WX_GAN[other]) return '';
  var me = WX_GAN[dayGan], it = WX_GAN[other];
  var rel;
  if (me === it) rel = '同';
  else if (SHENG[me] === it) rel = '生';
  else if (KE[me] === it) rel = '克';
  else if (KE[it] === me) rel = '被克';
  else rel = '被生';
  var same = (GAN.indexOf(dayGan)%2) === (GAN.indexOf(other)%2);
  return SHISHEN_REL[rel + (same?'同':'异')];
}
function kongwang(dayGan, dayZhi){
  var gi = GAN.indexOf(dayGan), zi = ZHI.indexOf(dayZhi);
  var offset = ((zi - gi) % 12 + 12) % 12;
  return ZHI[(offset+10)%12] + ZHI[(offset+11)%12];
}
function nayin(idx){
  idx = ((idx%60)+60)%60;
  var n = Math.floor(idx/2);
  var g = GAN[idx%10], z = ZHI[idx%12];
  var yang = (GAN.indexOf(g)%2 === 0) === (ZHI.indexOf(z)%2 === 0);
  return yang ? NAYIN[n] : NAYIN[n];
}
function parseJieqi(str, year){
  // "MM-DD HH:MM" → 时间戳（本地）
  if (!str) return null;
  var p = str.split(' ');
  var md = p[0].split('-'), hm = p[1].split(':');
  var d = new Date(year, Number(md[0])-1, Number(md[1]), Number(hm[0]), Number(hm[1]), 0, 0);
  return d.getTime();
}
function jieList(year){
  // 返回 [{ts, name, zhi}] 覆盖 year-1 与 year
  var out = [];
  [year-1, year, year+1].forEach(function(y){
    var row = JIEQI[y]; if (!row) return;
    for (var i=0;i<12;i++){
      var ts = parseJieqi(row[i], y);
      if (ts) out.push({ts: ts, name: JIE_NAMES[i], zhi: JIE_ZHI[i], year: y});
    }
  });
  out.sort(function(a,b){ return a.ts - b.ts; });
  return out;
}
function solar2true(dateObj, lon){
  // 北京时间 → 真太阳时（仅经度差）
  var delta = (lon - 120) * 4 * 60 * 1000; // 毫秒
  return { ts: dateObj.getTime() + delta, deltaMin: (lon-120)*4 };
}

// ══════════ 核心排盘 ══════════
function paipan(opts){
  var y = opts.y, m = opts.m, d = opts.d, hh = opts.hh, mm = opts.mm;
  var useTS = opts.useTrueSolar !== false;
  var lon = opts.lon == null ? 120 : opts.lon;
  var sex = opts.sex === '女' ? '女' : '男';

  var base = new Date(y, m-1, d, hh, mm, 0, 0);
  var ts = base.getTime(), deltaMin = 0;
  if (useTS && lon != null){
    var r = solar2true(base, lon);
    ts = r.ts; deltaMin = r.deltaMin;
  }
  var t = new Date(ts);
  var y2 = t.getFullYear(), m2 = t.getMonth()+1, d2 = t.getDate(), h2 = t.getHours(), mi2 = t.getMinutes();

  // ── 年柱（立春为界）
  var jl = jieList(y2);
  var lichun = null;
  for (var i=0;i<jl.length;i++){ if (jl[i].name === '立春' && jl[i].year === y2){ lichun = jl[i]; break; } }
  var yearNum = ts < (lichun ? lichun.ts : new Date(y2,1,4).getTime()) ? y2 - 1 : y2;
  var yearGanIdx = ((yearNum - 4) % 10 + 10) % 10;
  var yearZhiIdx = ((yearNum - 4) % 12 + 12) % 12;

  // ── 月柱（以"节"为界）
  var cur = null, prev = null;
  for (var j=0;j<jl.length;j++){ if (jl[j].ts <= ts) { prev = jl[j]; } }
  cur = prev || jl[0];
  var monthZhi = cur.zhi;
  var monthOff = ZHI.indexOf(monthZhi);
  var yinGan = (yearGanIdx * 2 + 2) % 10;      // 五虎遁：寅月月干
  var yinIdx = ((monthOff - ZHI.indexOf('寅')) % 12 + 12) % 12;
  var monthGanIdx = (yinGan + yinIdx) % 10;

  // ── 日柱（23 点后算次日）
  var jdnBase = jdn(y2, m2, d2);
  if (h2 >= 23 && opts.changeDay !== false) jdnBase += 1;
  var dIdx = dayIndex(jdnBase);
  var dayGanIdx = dIdx % 10, dayZhiIdx = dIdx % 12;

  // ── 时柱（五鼠遁）
  var zhiIdx = Math.floor(((h2 + 1) % 24) / 2) % 12;
  var ziGan = (dayGanIdx * 2) % 10;
  var timeGanIdx = (ziGan + zhiIdx) % 10;

  var pillars = [
    {name:'年', gi: yearGanIdx, zi: yearZhiIdx, idx: gzIndex(GAN[yearGanIdx], ZHI[yearZhiIdx])},
    {name:'月', gi: monthGanIdx, zi: monthOff, idx: gzIndex(GAN[monthGanIdx], ZHI[monthOff])},
    {name:'日', gi: dayGanIdx, zi: dayZhiIdx, idx: dIdx},
    {name:'时', gi: timeGanIdx, zi: zhiIdx, idx: gzIndex(GAN[timeGanIdx], ZHI[zhiIdx])}
  ];
  var dayGan = GAN[dayGanIdx];
  pillars.forEach(function(p, k){
    p.gz = GAN[p.gi] + ZHI[p.zi];
    p.ganSS = k === 2 ? '日主' : shishen(dayGan, GAN[p.gi]);
    p.cang = CANG[ZHI[p.zi]] || [];
    p.zhiSS = p.cang.map(function(g){ return shishen(dayGan, g); });
    p.nayin = nayin(p.idx);
  });

  // ── 大运
  var isMale = sex === '男';
  var yearGanYang = (yearGanIdx % 2 === 0);
  var forward = (yearGanYang && isMale) || (!yearGanYang && !isMale);
  var nextJie = null, prevJie = null;
  for (var k2=0;k2<jl.length;k2++){
    if (jl[k2].ts > ts && !nextJie) nextJie = jl[k2];
    if (jl[k2].ts <= ts) prevJie = jl[k2];
  }
  var ref = forward ? nextJie : prevJie;
  var diffDays = ref ? Math.abs(ref.ts - ts) / 86400000 : 0;
  var startYears = diffDays / 3;
  var monthGZIdx = pillars[1].idx;
  var dayun = [];
  for (var n=1;n<=9;n++){
    var idx = monthGZIdx + (forward ? n : -n);
    var g = GAN[((idx%60)+60)%60 % 10], z = ZHI[((idx%60)+60)%60 % 12];
    dayun.push({
      gz: gz(idx),
      startAge: Math.round((startYears + (n-1)*10) * 10)/10,
      endAge: Math.round((startYears + n*10) * 10)/10,
      startYear: Math.round(yearNum + startYears + (n-1)*10),
      ganSS: shishen(dayGan, g)
    });
  }

  // ── 五神格局（讲义体系）
  var monthWX = WX_ZHI[monthZhi];
  var dayWX = WX_GAN[dayGan];
  var ju, strong, yao;
  if (SHENG[monthWX] === dayWX){ ju = '印局'; strong = true; }
  else if (monthWX === dayWX){ ju = '比局'; strong = true; }
  else if (SHENG[dayWX] === monthWX){ ju = '伤局'; strong = false; }
  else if (KE[dayWX] === monthWX){ ju = '财局'; strong = false; }
  else { ju = '煞局'; strong = false; }
  yao = strong ? '财、伤、煞（泄克耗）' : '印、比（生助）';

  return {
    input: { date: y+'-'+pad2(m)+'-'+pad2(d), time: pad2(hh)+':'+pad2(mm), lon: lon, sex: sex,
             trueSolar: useTS, deltaMin: Math.round(deltaMin) },
    adjusted: { date: y2+'-'+pad2(m2)+'-'+pad2(d2), time: pad2(h2)+':'+pad2(mi2) },
    pillars: pillars,
    dayGan: dayGan,
    dayWX: dayWX,
    monthZhi: monthZhi,
    lunarYear: yearNum,
    kongwang: kongwang(dayGan, ZHI[dayZhiIdx]),
    shensha: {
      驿马: YIMA[ZHI[dayZhiIdx]] || '',
      桃花: TAOHUA[ZHI[dayZhiIdx]] || '',
      天乙贵人: TIANYI[dayGan] || '',
      文昌: WENCHANG[dayGan] || ''
    },
    qiyun: {
      forward: forward, days: Math.round(diffDays*10)/10,
      years: Math.round(startYears*10)/10,
      refJie: ref ? ref.name : ''
    },
    dayun: dayun,
    ju: { name: ju, strong: strong, yao: yao }
  };
}

// ══════════ 渲染 ══════════
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPan(r){
  var html = '';
  html += '<div class="card"><h2>四柱 <span class="tag">' + esc(r.adjusted.date) + ' ' + esc(r.adjusted.time) + '</span></h2>';
  html += '<div class="pan">';
  html += '<div class="hd"></div>';
  r.pillars.forEach(function(p){ html += '<div class="hd">' + p.name + '柱</div>'; });
  html += '<div class="lb">干支</div>';
  r.pillars.forEach(function(p){ html += '<div><span class="gz"><span class="g">' + p.gz[0] + '</span><span class="z">' + p.gz[1] + '</span></span></div>'; });
  html += '<div class="lb">干神</div>';
  r.pillars.forEach(function(p){ html += '<div class="ss">' + esc(p.ganSS) + '</div>'; });
  html += '<div class="lb">支神</div>';
  r.pillars.forEach(function(p){ html += '<div class="ss">' + p.zhiSS.map(esc).join('/') + '</div>'; });
  html += '<div class="lb">藏干</div>';
  r.pillars.forEach(function(p){ html += '<div class="cg">' + p.cang.join(' ') + '</div>'; });
  html += '<div class="lb">纳音</div>';
  r.pillars.forEach(function(p){ html += '<div class="ny">' + esc(p.nayin) + '</div>'; });
  html += '</div></div>';

  // 基本信息
  html += '<div class="card"><h2>结构</h2>';
  html += '<div class="kv"><span>日主</span><b>' + r.dayGan + '（' + r.dayWX + '）</b></div>';
  html += '<div class="kv"><span>月令</span><b>' + r.monthZhi + '（' + WX_ZHI[r.monthZhi] + '）</b></div>';
  html += '<div class="kv"><span>五神格局</span><b style="color:#A6392F">' + r.ju.name + '</b></div>';
  html += '<div class="kv"><span>强弱倾向</span><b>' + (r.ju.strong ? '命强（印/比当令）' : '命弱（伤/财/煞当令）') + '</b></div>';
  html += '<div class="kv"><span>病药方向</span><b>' + esc(r.ju.yao) + '</b></div>';
  html += '<div class="kv"><span>空亡</span><b>' + r.kongwang + '</b></div>';
  html += '<div class="kv"><span>真太阳时</span><b>' + (r.input.trueSolar ? (r.input.deltaMin >= 0 ? '+' : '') + r.input.deltaMin + ' 分钟' : '未校正') + '</b></div>';
  html += '<div class="kv"><span>神煞</span><span class="chips">' +
    ['驿马','桃花','天乙贵人','文昌'].filter(function(k){ return r.shensha[k]; }).map(function(k){
      return '<span class="chip">' + k + ' ' + r.shensha[k] + '</span>';
    }).join('') + '</span></div>';
  html += '<div class="warn">五神格局按讲义体系（月令 vs 日干）快速判定；深度分析需结合八格成败救应、用神变化、大运流年。</div>';
  html += '</div>';

  // 大运
  html += '<div class="card"><h2>大运 <span class="tag">' + (r.qiyun.forward ? '顺排' : '逆排') + ' · 起运 ' + r.qiyun.years + ' 岁</span></h2>';
  html += '<div class="dy">';
  var nowY = new Date().getFullYear();
  r.dayun.forEach(function(d){
    var cur = nowY >= d.startYear && nowY < d.startYear + 10;
    html += '<div class="it' + (cur ? ' cur' : '') + '"><div class="a">' + d.startYear + '起</div>' +
      '<div class="b">' + d.gz + '</div><div class="c">' + d.ganSS + '</div>' +
      '<div class="c">' + Math.round(d.startAge) + '–' + Math.round(d.endAge) + '岁</div></div>';
  });
  html += '</div>';
  html += '<div class="warn">大运吉凶取决于是否助成格局 / 破格，不能只看十神。详见《05_大运流年》。</div></div>';
  return html;
}

// ══════════ 交互 ══════════
function run(){
  var dv = document.getElementById('bd').value;
  var tv = document.getElementById('bt').value || '12:00';
  if (!dv){ alert('请选择出生日期'); return; }
  var p = dv.split('-'), q = tv.split(':');
  var useTS = document.querySelector('#segTS .on').getAttribute('data-ts') === '1';
  var changeDay = document.querySelector('#segDay .on').getAttribute('data-day') === '1';
  var r = paipan({
    y: +p[0], m: +p[1], d: +p[2], hh: +q[0], mm: +q[1],
    lon: parseFloat(document.getElementById('lon').value) || 120,
    sex: document.getElementById('sex').value,
    useTrueSolar: useTS,
    changeDay: changeDay
  });
  document.getElementById('out').innerHTML = renderPan(r);
  window.scrollTo({ top: 300, behavior: 'smooth' });
  window.__last = r;
}
document.getElementById('go').onclick = run;
document.getElementById('demo').onclick = function(){
  document.getElementById('bd').value = '1990-01-01';
  document.getElementById('bt').value = '12:00';
  document.getElementById('lon').value = 120.1;
  document.getElementById('sex').value = '男';
  run();
};
document.querySelectorAll('#segTS button, #segDay button').forEach(function(b){
  b.onclick = function(){
    var seg = b.parentNode;
    seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
  };
});
